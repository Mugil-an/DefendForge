services:
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: bluememory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - blue_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  target_app:
    build:
      context: ./target_app
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
    volumes:
      - ./target_app:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always
    networks:
      - target_internal
      - user_net
      - blue_net

  target_gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      UPSTREAM_URL: http://target_app:5000
      BLUE_AGENT_URL: http://blue_agent:8000/api/events
      TARGET_ID: default
      PROVENANCE_SECRET: ${PROVENANCE_SECRET:-local-development-secret}
    depends_on:
      target_app:
        condition: service_healthy
      blue_agent:
        condition: service_healthy
    command: ["uvicorn", "target_gateway.proxy:app", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ./rules:/app/rules:ro
    networks:
      - user_net
      - red_net
      - target_internal
      - blue_net

  minio:
    image: elestio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-change-me-minio}
    volumes:
      - minio_data:/data
    networks:
      - blue_net
    command: server /data --console-address ":9001"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - blue_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - blue_net

  blue_agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BLUE_AGENT_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: bluememory
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      # LLM — Gemini 3.8 Flash (primary) with Ollama fallback
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      LLM_API_KEY: dummy
      # Detection & RL
      PPO_MODEL_PATH: models/ppo_policy.zip
      DETECTION_MODEL_PATH: models/random_forest_24.joblib
      # Target & validation
      TARGET_APP_URL: http://target_gateway:8080
      VALIDATION_HEALTH_URL: http://target_gateway:8080/health
      RED_TARGET_URL: http://target_gateway:8080
      TARGET_MANIFEST_DIR: /app/targets
      PROVENANCE_SECRET: ${PROVENANCE_SECRET:-local-development-secret}
    depends_on:
      db:
        condition: service_healthy
      target_app:
        condition: service_healthy
      minio:
        condition: service_started
      elasticsearch:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./blue_agent:/app/blue_agent
      - ./red_agent:/app/red_agent
      - ./green_agent:/app/green_agent
      - ./target_platform:/app/target_platform
      - ./evaluation:/app/evaluation
      - ./mtd:/app/mtd
      - ./target_app:/app/target_app
      - ${TARGET_SOURCE_PATH:-./target_app}:/target
      - ./rules:/app/rules
      - ./models:/app/models
    networks:
      - blue_net
      - target_internal
    command: ["uvicorn", "blue_agent.api.routes:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 5

  red_agent:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BLUE_API_URL: http://blue_agent:8000
      # Manual launch: Red Agent waits indefinitely until triggered manually by the user via the UI/API
      RED_AUTO_START: ${RED_AUTO_START:-false}
      RED_WARMUP_SECONDS: ${RED_WARMUP_SECONDS:-30}
      RED_CAMPAIGN_ROUNDS: ${RED_CAMPAIGN_ROUNDS:-5}
      RED_CAMPAIGN_EVENTS: ${RED_CAMPAIGN_EVENTS:-25}
      RED_CAMPAIGN_INTERVAL: ${RED_CAMPAIGN_INTERVAL:-60}
      RED_MAX_CAMPAIGNS: ${RED_MAX_CAMPAIGNS:-0}
      RED_SIMULATION_ONLY: "false"
      RED_REQUEST_TIMEOUT: 5
      RED_TARGET_URL: http://target_gateway:8080
      TARGET_MANIFEST_DIR: /app/targets
      PROVENANCE_SECRET: ${PROVENANCE_SECRET:-local-development-secret}
      # Persistent memory uses the same PostgreSQL instance
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: bluememory
    depends_on:
      blue_agent:
        condition: service_healthy
    volumes:
      - ./blue_agent:/app/blue_agent
      - ./red_agent:/app/red_agent
      - ./green_agent:/app/green_agent
      - ./target_platform:/app/target_platform
      - ./evaluation:/app/evaluation
      - ./mtd:/app/mtd
      - ./target_app:/app/target_app
      - ${TARGET_SOURCE_PATH:-./target_app}:/target
      - ./rules:/app/rules
      - ./models:/app/models
    networks:
      - red_net
      - blue_net
    command: ["python", "-m", "red_agent.container_runner"]

  flow_sniffer:
    build:
      context: ./flow_sniffer
    network_mode: "service:target_app"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - BLUE_AGENT_URL=http://blue_agent:8000/api/netflow
    depends_on:
      - target_app
      - blue_agent

volumes:
  pgdata:
  minio_data:
  es_data:

networks:
  user_net:
  red_net:
  blue_net:
  target_internal:
    internal: true
