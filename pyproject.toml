[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "defendforge-blue-agent"
version = "0.1.0"
description = "Blue Agent — Collaborative Multi-Agent Cybersecurity Hardening"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["blue_agent*"]
